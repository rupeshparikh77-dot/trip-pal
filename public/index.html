<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>trip-pal · travel search</title>
  <style>
    :root {
      --bg: #0f1724;
      --panel: #16203180;
      --panel-solid: #1b2738;
      --line: #2a3850;
      --text: #e8eef7;
      --muted: #8da2bf;
      --accent: #38bdf8;
      --accent-2: #22d3a6;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 500px at 70% -10%, #1d3a5f55, transparent),
        radial-gradient(900px 500px at 0% 0%, #10463c55, transparent),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 28px 20px 8px;
      max-width: 960px;
      margin: 0 auto;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { font-size: 28px; margin: 0; letter-spacing: -0.5px; }
    .brand .dot { color: var(--accent); }
    .brand span.tag {
      font-size: 12px; color: var(--muted); border: 1px solid var(--line);
      padding: 2px 8px; border-radius: 999px;
    }
    .sub { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
    main { max-width: 960px; margin: 0 auto; padding: 16px 20px 60px; }
    .tabs { display: flex; gap: 6px; margin: 18px 0 14px; flex-wrap: wrap; }
    .tab {
      background: var(--panel-solid); color: var(--muted); border: 1px solid var(--line);
      padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 14px;
    }
    .tab.active { color: var(--text); border-color: var(--accent); background: #14304a; }
    .card {
      background: var(--panel-solid); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 18px;
    }
    form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #0e1826; color: var(--text); font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button.go {
      padding: 11px 20px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #052231; font-weight: 700; font-size: 14px;
    }
    .results { margin-top: 20px; display: grid; gap: 12px; }
    .result {
      background: var(--panel-solid); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px;
      display: flex; justify-content: space-between; gap: 16px; align-items: center;
    }
    .result .name { font-weight: 600; }
    .result .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .price { font-size: 18px; font-weight: 700; color: var(--accent-2); white-space: nowrap; }
    .badge {
      font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); margin-left: 8px;
    }
    .badge.demo { color: #fcd34d; border-color: #5a4a1f; }
    .badge.live { color: var(--accent-2); border-color: #1f5a4a; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .hidden { display: none; }
    code { background: #0e1826; padding: 1px 6px; border-radius: 6px; font-size: 12px; }
    footer { max-width: 960px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>trip<span class="dot">·</span>pal</h1>
      <span class="tag" id="mode-tag">checking…</span>
    </div>
    <p class="sub">Search flights, hotels & resorts. API: <code>/api/flights</code> · <code>/api/hotels</code> · <code>/api/resorts</code> · <code>/api/locations</code></p>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-tab="flights">✈️ Flights</div>
      <div class="tab" data-tab="hotels">🏨 Hotels</div>
      <div class="tab" data-tab="resorts">🌴 Resorts</div>
    </div>

    <div class="card">
      <!-- Flights -->
      <form id="form-flights" data-panel="flights">
        <div><label>From (IATA)</label><input name="origin" value="SIN" /></div>
        <div><label>To (IATA)</label><input name="destination" value="LHR" /></div>
        <div><label>Depart</label><input name="departureDate" type="date" value="2026-11-01" /></div>
        <div><label>Return (optional)</label><input name="returnDate" type="date" /></div>
        <div><label>Adults</label><input name="adults" type="number" min="1" value="1" /></div>
        <button class="go" type="submit">Search</button>
      </form>

      <!-- Hotels -->
      <form id="form-hotels" data-panel="hotels" class="hidden">
        <div><label>City code</label><input name="cityCode" value="LON" /></div>
        <div><label>Check-in</label><input name="checkIn" type="date" value="2026-11-01" /></div>
        <div><label>Check-out</label><input name="checkOut" type="date" value="2026-11-04" /></div>
        <div><label>Adults</label><input name="adults" type="number" min="1" value="1" /></div>
        <button class="go" type="submit">Search</button>
      </form>

      <!-- Resorts -->
      <form id="form-resorts" data-panel="resorts" class="hidden">
        <div style="grid-column: 1 / -1;"><label>Destination</label><input name="destination" value="Bali" /></div>
        <button class="go" type="submit">Search</button>
      </form>
    </div>

    <div class="results" id="results">
      <div class="empty">Run a search to see results.</div>
    </div>
  </main>

  <footer>
    trip-pal demo UI · results marked <span class="badge demo">demo</span> are sample data;
    <span class="badge live">live</span> means Amadeus returned them.
  </footer>

  <script>
    const $ = (s) => document.querySelector(s);
    const resultsEl = $('#results');

    // Mode tag
    fetch('/health').then(r => r.json()).then(d => {
      const t = $('#mode-tag');
      t.textContent = d.mode === 'live' ? 'live data' : 'demo data';
      t.style.color = d.mode === 'live' ? '#22d3a6' : '#fcd34d';
    }).catch(() => {});

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('form[data-panel]').forEach(f => f.classList.add('hidden'));
        $(`#form-${tab.dataset.tab}`).classList.remove('hidden');
        resultsEl.innerHTML = '<div class="empty">Run a search to see results.</div>';
      });
    });

    function qs(form) {
      const p = new URLSearchParams();
      for (const [k, v] of new FormData(form).entries()) if (v) p.set(k, v);
      return p.toString();
    }

    function sourceBadge(source) {
      const live = source === 'live';
      return `<span class="badge ${live ? 'live' : 'demo'}">${source}</span>`;
    }

    function fmtPrice(p) {
      if (!p || !p.total) return '—';
      return `${p.currency || ''} ${Number(p.total).toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
    }

    function renderFlights(d) {
      return d.results.map(o => {
        const out = o.itineraries[0];
        const seg = out.segments[0];
        const last = out.segments[out.segments.length - 1];
        return `<div class="result">
          <div>
            <div class="name">${seg.from} → ${last.to} <span class="meta">${out.segments.map(s => s.flightNumber).join(' · ')}</span></div>
            <div class="meta">${out.duration.replace('PT','').toLowerCase()} · ${out.stops === 0 ? 'nonstop' : out.stops + ' stop(s)'} · ${o.itineraries.length > 1 ? 'round-trip' : 'one-way'}</div>
          </div>
          <div class="price">${fmtPrice(o.price)}</div>
        </div>`;
      }).join('');
    }

    function renderHotels(d) {
      return d.results.map(h => `<div class="result">
        <div>
          <div class="name">${h.name}</div>
          <div class="meta">${h.roomDescription || ''} · ${h.checkIn || ''} → ${h.checkOut || ''}</div>
        </div>
        <div class="price">${fmtPrice(h.price)}</div>
      </div>`).join('');
    }

    function renderResorts(d) {
      return d.results.map(r => `<div class="result">
        <div>
          <div class="name">${r.name} <span class="meta">★ ${r.rating} · ${r.type}</span></div>
          <div class="meta">${(r.amenities || []).join(' · ')}</div>
        </div>
        <div class="price">${fmtPrice(r.pricePerNight)}<div class="meta" style="text-align:right">/night</div></div>
      </div>`).join('');
    }

    const renderers = { flights: renderFlights, hotels: renderHotels, resorts: renderResorts };
    const endpoints = { flights: '/api/flights', hotels: '/api/hotels', resorts: '/api/resorts' };

    document.querySelectorAll('form[data-panel]').forEach(form => {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const kind = form.dataset.panel;
        resultsEl.innerHTML = '<div class="empty">Searching…</div>';
        try {
          const res = await fetch(`${endpoints[kind]}?${qs(form)}`);
          const data = await res.json();
          if (data.error) { resultsEl.innerHTML = `<div class="empty">${data.error}</div>`; return; }
          const rows = data.results?.length ? renderers[kind](data) : '<div class="empty">No results.</div>';
          const header = `<div class="meta" style="margin-bottom:4px">${data.results?.length || 0} result(s) ${sourceBadge(data.source)}</div>`;
          resultsEl.innerHTML = header + rows;
        } catch (err) {
          resultsEl.innerHTML = `<div class="empty">Request failed: ${err.message}</div>`;
        }
      });
    });
  </script>
</body>
</html>
